# conda-Umgebung (Alternative zu uv + requirements.txt).
#   conda env create -f environment.yml && conda activate holophd
# holowizard (HoloWizard/HoloForge, DESY) gibt es nur auf PyPI und verlangt Python >=3.11,<3.12.
name: holophd
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
