[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holofocus"
version = "0.1.0"
description = "Learning-based autofocus for X-ray near-field holography (master's thesis code, TUHH IBI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohamad Ali Rajeh" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "scipy>=1.10"]

[project.scripts]
holofocus-dataset = "holofocus.dataset.cli:main"
holofocus-baseline = "holofocus.baseline.cli:main"
holofocus-learn = "holofocus.learned.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
