name: spectrum-cnn-wide
target_scale: 0.005
representation:
  kind: spectrum
  binning: 2
  bins: 1024
  f2_max: 0.125
model:
  channels:
  - 32
  - 64
  - 128
  - 128
  kernel_size: 7
  pool_to: 16
  hidden: 128
  dropout: 0.1
  min_sigma: 0.001
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 2
  beta: 0.5
  augment: false
  limit: null
  patience: null
  seed: 2
device: auto
