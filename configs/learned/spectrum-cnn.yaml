# Learned autofocus (Stage 4): 1-D CNN on the radially averaged power spectrum.
#
# Input: log power spectrum of the Hann-windowed 512^2 hologram (configs/dataset/cpu-4x.yaml)
# in 1024 bins of f^2 up to 0.125 cycles^2/px^2 (bin width 1.2e-4 = Fr / 12): the CTF minima
# at f^2 = k Fr (Fr = 1.43e-3 .. 1.58e-3) form a periodic pattern whose period is Fr.
# Output: mean and variance of dz01 / 5 mm (Omega_z of [2]). Lengths in metres.
name: spectrum-cnn
target_scale: 5.0e-3
representation:
  kind: spectrum
  bins: 1024
  f2_max: 0.125
model:
  channels: [16, 32, 64, 64]
  kernel_size: 7
  pool_to: 16
  hidden: 128
  dropout: 0.1
  min_sigma: 1.0e-3       # 5 um
training:
  epochs: 100
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 2
  beta: 0.5               # beta-NLL
  augment: false          # the radial average is already rotation and flip invariant
  limit: null
  patience: null
  seed: 0
device: auto
