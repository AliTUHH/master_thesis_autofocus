# Main NPE of Stage 7 ([6]): posterior of dz01 from a neural spline flow on the spectrum
# representation of spectrum-cnn-wide.yaml. The embedding is the convolution stack and head
# width of spectrum-cnn-wide with 32 outputs in place of the Gaussian head; the flow is sbi's
# default NSF. Schedule of the CNN (100 epochs, batch 32, AdamW, warm-up and cosine decay);
# the epoch with the smallest validation loss -log q is kept.
name: npe-nsf
target_scale: 5.0e-3
representation:
  kind: spectrum
  bins: 1024
  f2_max: 0.125
embedding:
  channels: [32, 64, 128, 128]
  kernel_size: 7
  pool_to: 16
  hidden: 128
  dropout: 0.1
  features: 32
density:
  estimator: nsf
  hidden_features: 50
  num_transforms: 5
  num_bins: 10
training:
  epochs: 100
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 2
  clip_max_norm: 5.0
  limit: null
  patience: null
  seed: 0
grid_points: 2001
device: auto
