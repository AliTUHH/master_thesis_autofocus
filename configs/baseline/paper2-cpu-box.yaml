# Nelder-Mead of [2] in a learned interval (Stage 9): the method of paper2-cpu.yaml, unchanged,
# searching in the interval of holofocus-baseline run --box instead of Omega_z, with its ends
# as the initial simplex. The extra reconstruction at the true z01 is skipped: it does not
# depend on the search and is already in the Stage 3 run.
name: paper2-cpu-box
reconstruction:
  schedule: paper2
  padding_factor: 2.0
  fade_width: null
  a0: 1.0
  update: reference
  gradient: reference
  pin_phase: true
  precision: single
  device: auto
search:
  confidence: 5.0e-3
  xatol: 1.0e-4
  fatol: 1.0e6
  max_evaluations: null
evaluate_truth: false
