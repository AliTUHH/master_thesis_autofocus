# Variante von data_small.yaml für die Regime-Studie des CTF-Ring-Fits (src.baseline.ctf_ringfit):
# dünne Mg-Phantome (1–2 µm statt 30 µm -> Phasenschub ~0.15–0.3 rad statt ~5 rad, also *schwache*
# Objekte, für die die lineare CTF-Näherung gilt) und zusätzlich gespeichertes rauschfreies Hologramm
# (images/gt_hologram), um den Einfluss von Rauschen und Objektstärke getrennt zu messen.
# Geometrie, Seeds und Rauschen sind identisch zu data_small.yaml; nur ein Test-Split (100 Hologramme):
#   python -m src.data.generate_data --config configs/data_small_weak.yaml
#   python -m src.baseline.ctf_ringfit --data data/processed/small_weak/test.hdf5 [--hologram-key images/gt_hologram]
name: small_weak
output_dir: data/processed

num_samples:
  train: 0
  val: 0
  test: 100

seeds:
  train: 1000
  val: 2000
  test: 3000

setup:
  detector_size: 2048
  detector_px_size_mm: 0.0065
  energy_kev: 11.0
  padding_factor: 2
  downsample_factor: 8
  z01_mm:
    min: 50.0
    max: 300.0
    distribution: uniform
  z02_mm: 20000.0

phantom:
  materials: [Mg]
  num_shapes: [1, 3]
  thickness_um: [1, 2]                # schwaches Objekt (data_small: [30, 30])
  position: random
  shapes: [Rectangle, Polygon, Ellipse, Ball, Cylinder, CylinderRoundTip]
  radius_range_px: [64, 512]
  size_range_px: [64, 1024]
  polygon_max_corners: 4
  ellipse_max_cut: 0
  rotate: true
  smoothing:
    kernel_size: 3
    sigma: 1.0

probe:
  constant: 1.0
  linear: 0.0
  square: 0.0
  center_beam: true
  noise: null

hologram_noise:
  type: Gaussian
  mean: 0.0
  std: 1.0
  intensity: 0.05

store:
  hologram: true
  gt_hologram: true                   # rauschfreie Amplitude zusätzlich speichern
  phantom: false
  probe: false
  flatfield: false
  polynomial: false
cache_size: 10

forge_overrides: {}
