# Training data with the measured properties of the cactus needle (Stage 5, Laborbuch 05).
#
# matched-cactus_needle.yaml changed by holofocus.learned.sim2real.realistic_changes: the
# "combined" perturbation with ranges around the measured values. Gaussian detector PSF of
# 1.2-2.0 unbinned pixels (corner fits 1.4-1.8 px), photons log-uniform within a factor 2 of
# the white part of the measured corners (3.9e4 per binned pixel), correlated flat-field
# residual of 1.3-5.2 % RMS (measured 2.6 %) with the corner frequency 0.18 per binned pixel,
# and the object of the measured hologram: fibers with 2-6 rad phase shift, 8-25 % of the field
# of view wide, delta/beta = 1300 (cellulose at 17 keV). Own seed.
name: matched-cactus_needle-realistic
seed: 20261053
geometry:
  energy_kev: 17.0
  z02: 19.652
  z01_guess: 0.2861
  z01_guess_range: null
  detector_pixel_size: 6.5e-6
  detector_shape: [2048, 2048]
  binning: 4
sampling:
  dz01_range: [-5.0e-3, 5.0e-3]
simulation:
  padding_margin: 1.0
  oversample: 2
  a0_range: [1.0, 1.0]
  psf_sigma_range: [1.2, 2.0]
  device: auto
  precision: single
phantoms:
  types: {fiber: 1.0}
  delta_beta: 1300.0
  phase_shift_range: [2.0, 6.0]
  size_range: [0.15, 0.6]
  margin: 0.05
  supersample: 4
  fiber_diameter_range: [0.08, 0.25]
noise:
  model: poisson_gaussian
  photons_range: [1.95e4, 7.8e4]
  read_noise: 2.0
  flat_field_range: [0.013, 0.052]
  flat_field_cutoff: 0.18
storage:
  store_phase: false
  store_clean: false
  compression: gzip
  compression_level: 4
splits:
  train: 6000
  val: 250
  test: 250
