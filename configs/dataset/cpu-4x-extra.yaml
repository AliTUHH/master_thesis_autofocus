# Extra training samples for Stage 4: the physics of cpu-4x.yaml (geometry, sampling,
# simulation, phantoms, noise; tests/test_dataset_config.py checks that they match) with
# another seed, so the samples are independent of the cpu-4x splits. Only a train split;
# the phase is not stored (not needed for training; 0.68 instead of 0.73 MB per sample).
name: cpu-4x-extra
seed: 20261022
geometry:
  energy_kev: 11.0
  z02: 20.0
  z01_guess: 0.100
  z01_guess_range: null
  detector_pixel_size: 6.5e-6
  detector_shape: [2048, 2048]
  binning: 4
sampling:
  dz01_range: [-5.0e-3, 5.0e-3]
simulation:
  padding_margin: 1.0
  oversample: 2
  a0_range: [1.0, 1.0]
  device: auto
  precision: single
phantoms:
  types: {triangle: 1.0, cell: 1.0, ball: 1.0, mixed: 1.0}
  delta_beta: 200.0
  phase_shift_range: [0.5, 2.0]
  size_range: [0.15, 0.6]
  margin: 0.05
  supersample: 4
noise:
  model: poisson_gaussian
  photons_range: [1.0e3, 1.0e5]
  read_noise: 2.0
storage:
  store_phase: false
  store_clean: false
  compression: gzip
  compression_level: 4
splits:
  train: 8000
