# Leave-one-out training data for the measured spider hair (Stage 6).
#
# matched-spider_hair.yaml changed by holofocus.learned.objectmodel.loo_changes: what the
# measured holograms show about detector and object comes from the other three (tooth, cactus
# needle, Mg wire) as ranges, widened by a factor of 2; the setup and delta/beta = 600
# (composition of the sample) stay. Gaussian detector PSF of 1.2-1.94 unbinned pixels,
# 1.55e4-7.8e4 photons per binned pixel (log-uniform), flat-field residual of 1.3-7.8 % RMS with
# the corner frequency 0.151 per binned pixel; fibers of 4-100 % of the field of view (log-
# uniform) with 0.0155-0.0957 rad per binned pixel of projected thickness (log-uniform); a
# texture with the power-law slope 1.25-2.25 inside the fiber and as a film over the field of
# view, each 0.005-1.07 rad RMS (log-uniform). Own seed.
name: loo-spider_hair
seed: 20261061
geometry:
  energy_kev: 11.0
  z02: 19.661
  z01_guess: 0.0798
  z01_guess_range: null
  detector_pixel_size: 6.5e-06
  detector_shape: [2048, 2048]
  binning: 4
sampling:
  dz01_range: [-0.005, 0.005]
simulation:
  padding_margin: 1.0
  oversample: 2
  a0_range: [1.0, 1.0]
  psf_sigma_range: [1.2, 1.94]
  device: auto
  precision: single
phantoms:
  types: {fiber: 1.0}
  delta_beta: 600.0
  phase_shift_range: [0.5, 2.0]
  size_range: [0.15, 0.6]
  margin: 0.05
  supersample: 4
  fiber_diameter_range: [0.04, 1.0]
  phase_per_pixel_range: [0.0155, 0.0957]
  texture_rms_range: [0.005, 1.07]
  background_texture_rms_range: [0.005, 1.07]
  texture_slope_range: [1.25, 2.25]
  texture_cutoff: 0.01
noise:
  model: poisson_gaussian
  photons_range: [15500.0, 78000.0]
  read_noise: 2.0
  flat_field_range: [0.013, 0.078]
  flat_field_cutoff: 0.151
storage: {store_phase: false, store_clean: false, compression: gzip, compression_level: 4}
splits: {train: 6000, val: 250, test: 250}
