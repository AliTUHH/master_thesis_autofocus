# CI-sized demo dataset: same physics as cpu-4x.yaml, detector binned 16x (128^2 pixels of
# 104 um, Fr = 0.024 at z01 = 100 mm). Generated by the GitHub Actions workflow in seconds.
name: ci
seed: 7
geometry:
  energy_kev: 11.0
  z02: 20.0
  z01_guess: 0.100
  binning: 16
sampling:
  dz01_range: [-5.0e-3, 5.0e-3]
simulation:
  device: cpu
phantoms:
  types: {triangle: 1.0, cell: 1.0, ball: 1.0, mixed: 1.0}
noise:
  model: poisson_gaussian
  photons_range: [1.0e3, 1.0e5]
  read_noise: 2.0
storage:
  store_phase: true
  store_clean: true
splits:
  train: 32
  val: 8
  test: 8
