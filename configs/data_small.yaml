# Kleiner Datensatz für CPU-Smoke-Tests: P05-Detektor (2048 px, 6.5 µm) um Faktor 8 gebinnt
# -> 256 px mit effektiver Pixelgröße 0.052 mm, Padding 2 (Simulationsgitter 512 px).
# Das Binning hält die Fresnel-Propagation korrekt abgetastet: der Transferfunktions-Propagator
# verlangt Fr >= 1 / (detector_size/downsample * padding_factor) = 1/512; mit 6.5-µm-Pixeln bei
# 256 px wäre Fr ~ 1e-4 << 1/512 (Aliasing). Erzeugt mit HoloForge:
#   python -m src.data.generate_data --config configs/data_small.yaml
# Einheiten: Längen in mm, Pixelgröße in mm, Energie in keV, Dicken in µm, Fr dimensionslos.
name: small
output_dir: data/processed            # Ausgabe: <output_dir>/<name>/{train,val,test}.hdf5 + meta.json

num_samples:                          # Anzahl Hologramme pro Split
  train: 400
  val: 100
  test: 100

seeds:                                # pro Split disjunkt; seedet torch, numpy.random und den z01-Generator
  train: 1000
  val: 2000
  test: 3000

setup:                                # -> src.data.forge_setup.NFHRandomDistSetup
  detector_size: 2048                 # physischer Detektor in Pixeln (quadratisch), vor dem Binning
  detector_px_size_mm: 0.0065         # physische Pixelgröße in mm (6.5 µm, wie P05/PETRA III)
  energy_kev: 11.0                    # Photonenenergie in keV (λ = 1.2398/E nm ≈ 0.1127 nm)
  padding_factor: 2                   # Simulationsgitter = (detector_size/downsample_factor) * padding_factor
  downsample_factor: 8                # Binning: 2048/8 = 256 px, Pixelgröße 8·0.0065 = 0.052 mm (so im HDF5 gespeichert)
  z01_mm:                             # Fokus–Objekt-Abstand, pro Hologramm neu gezogen
    min: 50.0
    max: 300.0
    distribution: uniform             # uniform | loguniform
  z02_mm: 20000.0                     # Fokus–Detektor-Abstand; Skalar = fest, oder {min: ..., max: ...}
                                      # -> Fr in [3.0e-3, 1.8e-2] (Fr = px²·z01 / (λ·z02·(z02−z01)), px = 0.052 mm)

phantom:                              # HoloForge PhantomGenerator + ShapeSampler
  materials: [Mg]                     # Elementsymbole (δ, β via xraylib bei energy_kev)
  num_shapes: [1, 3]                  # [min, max] Anzahl Formen pro Phantom
  thickness_um: [30, 30]              # [min, max] Dicke in µm (ganzzahlig gezogen)
  position: random                    # random | center
  shapes: [Rectangle, Polygon, Ellipse, Ball, Cylinder, CylinderRoundTip]
  radius_range_px: [64, 512]          # Radien (Ball, Ellipse, Zylinder) in physischen Pixeln; HoloForge teilt
  size_range_px: [64, 1024]           # Kantenlängen/Höhen ebenso -> 8–64 bzw. 8–128 px nach dem Binning
  polygon_max_corners: 4
  ellipse_max_cut: 0
  rotate: true
  smoothing:                          # Gauss-Glättung des Phantoms (von HoloForge 3.0.6 zwingend benötigt)
    kernel_size: 3
    sigma: 1.0

probe:                                # polynomiale Beleuchtung I(x,y) = constant + lineare + quadratische Terme
  constant: 1.0                       # Amplitude (Skalar)
  linear: 0.0                         # Betragsgrenze der linearen Koeffizienten (0 = flach)
  square: 0.0                         # Betragsgrenze der quadratischen Koeffizienten
  center_beam: true                   # Strahlzentrum leicht zufällig verschieben
  noise: null                         # z. B. {type: Poisson, intensity: 0.1, lam: 0.7}

hologram_noise:                       # additives Rauschen auf der Hologramm-Amplitude; null = aus
  type: Gaussian                      # Gaussian (mean, std, intensity) | Poisson (lam, intensity)
  mean: 0.0
  std: 1.0
  intensity: 0.05

store:                                # zusätzliche Arrays im HDF5 (Setup-Labels werden immer gespeichert)
  hologram: true
  gt_hologram: false                  # rauschfreie Amplitude
  phantom: false                      # komplexes Phantom (Phasenschub + i·Absorption)
  probe: false
  flatfield: false
  polynomial: false                   # Strahl-Polynomkoeffizienten
cache_size: 10                        # HDF5-Schreibpuffer (Samples)

forge_overrides: {}                   # optionale rohe HoloForge-JSON-Blöcke (z. B. flatfield_dataset), zuletzt gemerged
