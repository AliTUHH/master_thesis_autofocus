name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,npe]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

      - name: Figure scripts (quick mode)
        run: |
          python scripts/make_stage1_figures.py --quick --out ${{ runner.temp }}/figures
          python scripts/make_stage2_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Demo dataset (configs/dataset/ci.yaml)
        run: |
          holofocus-dataset generate configs/dataset/ci.yaml --out ${{ runner.temp }}/demo-dataset
          holofocus-dataset inspect ${{ runner.temp }}/demo-dataset/*.h5

      - name: Baseline smoke run (configs/baseline/ci.yaml) and Stage 3 figures (quick mode)
        run: |
          holofocus-baseline run configs/baseline/ci.yaml \
            --data ${{ runner.temp }}/demo-dataset/test.h5 --out ${{ runner.temp }}/baseline-ci --limit 3
          holofocus-baseline summary ${{ runner.temp }}/baseline-ci
          python scripts/make_stage3_figures.py --quick --baseline ${{ runner.temp }}/baseline-ci \
            --out ${{ runner.temp }}/figures

      - name: Learned autofocus smoke run (configs/learned/ci.yaml) and Stage 4 figures (quick mode)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          learned=${{ runner.temp }}/learned-ci
          holofocus-learn train configs/learned/ci.yaml --train $demo/train.h5 --val $demo/val.h5 \
            --out $learned
          holofocus-learn predict $learned --data $demo/val.h5 --out $learned/val
          holofocus-learn predict $learned --data $demo/test.h5 --out $learned/test
          holofocus-baseline run configs/baseline/ci.yaml --data $demo/test.h5 \
            --out ${{ runner.temp }}/warm-ci --limit 3 --warm-start $learned/test/predictions.csv
          holofocus-learn compare --learned $learned/test/predictions.csv \
            --baseline ${{ runner.temp }}/baseline-ci --baseline-val ${{ runner.temp }}/baseline-ci \
            --warm ${{ runner.temp }}/warm-ci --out ${{ runner.temp }}/comparison-ci
          python scripts/make_stage4_figures.py --quick --main $learned --finals $learned --study $learned/none \
            --comparison ${{ runner.temp }}/comparison-ci --baseline ${{ runner.temp }}/baseline-ci \
            --baseline-val ${{ runner.temp }}/baseline-ci --warm ${{ runner.temp }}/warm-ci \
            --data $demo --out ${{ runner.temp }}/figures

      - name: Sim-to-real smoke run (perturbed demo test split) and Stage 5 figures (quick mode)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          learned=${{ runner.temp }}/learned-ci
          python scripts/run_stage5_study.py --threads 2 perturb --samples cactus_needle \
            --data $demo/test.h5 --model $learned --reference $learned/test/predictions.csv \
            --limit 4 --sets ${{ runner.temp }}/sim2real-sets --out ${{ runner.temp }}/sim2real-ci
          python scripts/make_stage5_figures.py --quick --learned $learned/none \
            --measured $learned/none --sim2real ${{ runner.temp }}/sim2real-ci \
            --out ${{ runner.temp }}/figures-ci
          python scripts/make_stage5_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Upload demo dataset
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-dataset-ci
          path: ${{ runner.temp }}/demo-dataset
          retention-days: 30
