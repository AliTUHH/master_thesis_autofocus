name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

      - name: Figure scripts (quick mode)
        run: |
          python scripts/make_stage1_figures.py --quick --out ${{ runner.temp }}/figures
          python scripts/make_stage2_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Demo dataset (configs/dataset/ci.yaml)
        run: |
          holofocus-dataset generate configs/dataset/ci.yaml --out ${{ runner.temp }}/demo-dataset
          holofocus-dataset inspect ${{ runner.temp }}/demo-dataset/*.h5

      - name: Baseline smoke run (configs/baseline/ci.yaml) and Stage 3 figures (quick mode)
        run: |
          holofocus-baseline run configs/baseline/ci.yaml \
            --data ${{ runner.temp }}/demo-dataset/test.h5 --out ${{ runner.temp }}/baseline-ci --limit 3
          holofocus-baseline summary ${{ runner.temp }}/baseline-ci
          python scripts/make_stage3_figures.py --quick --baseline ${{ runner.temp }}/baseline-ci \
            --out ${{ runner.temp }}/figures

      - name: Upload demo dataset
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-dataset-ci
          path: ${{ runner.temp }}/demo-dataset
          retention-days: 30
