name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,npe]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

      - name: Figure scripts (quick mode)
        run: |
          python scripts/make_stage1_figures.py --quick --out ${{ runner.temp }}/figures
          python scripts/make_stage2_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Demo dataset (configs/dataset/ci.yaml)
        run: |
          holofocus-dataset generate configs/dataset/ci.yaml --out ${{ runner.temp }}/demo-dataset
          holofocus-dataset inspect ${{ runner.temp }}/demo-dataset/*.h5

      - name: Baseline smoke run (configs/baseline/ci.yaml) and Stage 3 figures (quick mode)
        run: |
          holofocus-baseline run configs/baseline/ci.yaml \
            --data ${{ runner.temp }}/demo-dataset/test.h5 --out ${{ runner.temp }}/baseline-ci --limit 3
          holofocus-baseline summary ${{ runner.temp }}/baseline-ci
          python scripts/make_stage3_figures.py --quick --baseline ${{ runner.temp }}/baseline-ci \
            --out ${{ runner.temp }}/figures

      - name: Learned autofocus smoke run (configs/learned/ci.yaml) and Stage 4 figures (quick mode)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          learned=${{ runner.temp }}/learned-ci
          holofocus-learn train configs/learned/ci.yaml --train $demo/train.h5 --val $demo/val.h5 \
            --out $learned
          holofocus-learn predict $learned --data $demo/val.h5 --out $learned/val
          holofocus-learn predict $learned --data $demo/test.h5 --out $learned/test
          holofocus-baseline run configs/baseline/ci.yaml --data $demo/test.h5 \
            --out ${{ runner.temp }}/warm-ci --limit 3 --warm-start $learned/test/predictions.csv
          holofocus-learn compare --learned $learned/test/predictions.csv \
            --baseline ${{ runner.temp }}/baseline-ci --baseline-val ${{ runner.temp }}/baseline-ci \
            --warm ${{ runner.temp }}/warm-ci --out ${{ runner.temp }}/comparison-ci
          python scripts/make_stage4_figures.py --quick --main $learned --finals $learned --study $learned/none \
            --comparison ${{ runner.temp }}/comparison-ci --baseline ${{ runner.temp }}/baseline-ci \
            --baseline-val ${{ runner.temp }}/baseline-ci --warm ${{ runner.temp }}/warm-ci \
            --data $demo --out ${{ runner.temp }}/figures

      - name: Sim-to-real smoke run (perturbed demo test split) and Stage 5 figures (quick mode)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          learned=${{ runner.temp }}/learned-ci
          python scripts/run_stage5_study.py --threads 2 perturb --samples cactus_needle \
            --data $demo/test.h5 --model $learned --reference $learned/test/predictions.csv \
            --limit 4 --sets ${{ runner.temp }}/sim2real-sets --out ${{ runner.temp }}/sim2real-ci
          python scripts/make_stage5_figures.py --quick --learned $learned/none \
            --measured $learned/none --sim2real ${{ runner.temp }}/sim2real-ci \
            --out ${{ runner.temp }}/figures-ci
          python scripts/make_stage5_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Stage 6 comparison and figures (quick mode, from the committed results)
        run: |
          python scripts/run_stage6_study.py compare --out ${{ runner.temp }}/objectmodel-ci
          python scripts/make_stage6_figures.py --quick --out ${{ runner.temp }}/figures

      - name: NPE smoke run (configs/learned/npe-ci.yaml), Stage 7 study and figures (quick mode)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          learned=${{ runner.temp }}/learned-ci
          root=${{ runner.temp }}/npe-ci
          mkdir -p $root/data/matched-cactus_needle $root/learned/matched-cactus_needle
          ln -s $demo/val.h5 $root/data/matched-cactus_needle/val.h5
          ln -s $demo/test.h5 $root/data/matched-cactus_needle/test.h5
          cp -r $learned/test $root/learned/matched-cactus_needle/
          for run in npe-nsf matched-cactus_needle; do
            holofocus-learn npe-train configs/learned/npe-ci.yaml --train $demo/train.h5 \
              --val $demo/val.h5 --out $root/npe/$run --threads 2
          done
          study="python scripts/run_stage7_study.py --threads 2 --npe $root/npe --cnn $learned"
          $study predict --data $root/data --val $demo/val.h5 --test $demo/test.h5 \
            --calibration $demo/val.h5
          $study sbc --calibration $demo/val.h5 --samples 100
          $study compare --test $demo/test.h5 --calibration $demo/val.h5 --baseline $root/none
          $study timing --test $demo/test.h5 --samples 4 --repeats 1
          $study examples --test $demo/test.h5 --indices 0 1 --worst 1
          $study perturb --samples cactus_needle --perturbations noise object --limit 4 \
            --data $root/data --sets $root/sets --cnn-learned $root/learned --cnn-sim2real $root/none
          python scripts/make_stage7_figures.py --quick --npe $root/npe --cnn $learned \
            --learned $root/learned --measured $root/none --out ${{ runner.temp }}/figures-ci
          python scripts/make_stage7_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Stage 7 on the object model (smoke run; comparison and figures from the committed results)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          root=${{ runner.temp }}/npe-loo-ci
          mkdir -p $root/data/loo-cactus_needle $root/learned
          ln -s $demo/val.h5 $root/data/loo-cactus_needle/val.h5
          ln -s $demo/test.h5 $root/data/loo-cactus_needle/test.h5
          ln -s ${{ runner.temp }}/learned-ci $root/learned/loo-cactus_needle
          train="configs/learned/npe-ci.yaml --train $demo/train.h5 --val $demo/val.h5 --threads 2"
          holofocus-learn npe-train $train --out $root/npe/matched-cactus_needle
          holofocus-learn npe-train $train --seed 1 --out $root/npe/matched-cactus_needle-seed1
          study="python scripts/run_stage7_loo_study.py --threads 2 --npe $root/npe"
          study="$study --cnn $root/learned --cnn-seeds $root/none"
          pick="--seeds 0 1 --samples cactus_needle"
          $study predict --data $root/data $pick
          $study compare $pick
          $study timing --data $root/data --per-sample 2 --repeats 1 $pick
          python scripts/make_stage7_loo_figures.py --quick --npe $root/npe --cnn $root/learned \
            --cnn-seeds $root/none --out ${{ runner.temp }}/figures-loo-ci
          python scripts/run_stage7_loo_study.py compare --out ${{ runner.temp }}/npe-loo-compare
          python scripts/make_stage7_loo_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Stage 8 (misspecification and ensembles on the Stage 7 smoke runs; ensembles, warm start and figures from the committed results)
        run: |
          root=${{ runner.temp }}/npe-loo-ci
          ln -s ${{ runner.temp }}/demo-dataset/train.h5 $root/data/loo-cactus_needle/train.h5
          study="python scripts/run_stage8_study.py --threads 2"
          pick="--seeds 0 1 --samples cactus_needle --npe $root/npe --cnn $root/learned"
          pick="$pick --cnn-seeds $root/none --sources $root/none"
          $study misspec $pick --data $root/data --resamples 50 --out $root/misspecification
          $study ensembles $pick --out $root/ensembles
          python scripts/make_stage8_figures.py --quick --misspec $root/misspecification \
            --ensembles $root/ensembles --measured $root/none --out ${{ runner.temp }}/figures-stage8-ci
          $study ensembles --out ${{ runner.temp }}/ensembles-ci
          $study warmstart --out ${{ runner.temp }}/warmstart-ci
          python scripts/make_stage8_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Stage 9 (Brent in the 95 % intervals of the smoke-run CNN, synthetic against the smoke-run baseline; steps, comparison and figures from the committed results)
        run: |
          demo=${{ runner.temp }}/demo-dataset
          root=${{ runner.temp }}/stage9-ci
          study="python scripts/run_stage9_study.py --threads 2"
          $study sources --cnn ${{ runner.temp }}/learned-ci/test/predictions.csv --out $root
          holofocus-baseline run configs/baseline/ci-brent.yaml --data $demo/test.h5 \
            --out $root/brent-box --limit 3 --box $root/intervals-cnn-test.csv
          holofocus-baseline summary $root/brent-box
          t=${{ runner.temp }}/baseline-ci/traces.jsonl
          z=$(python -c "import json; r = next(r for r in map(json.loads, open('$t')) if r['index'] == 0); print(*[repr(e['z01']) for e in r['evaluations'] if e['reconstructed']][:2])")
          one="synthetic --index 0 --data $demo/test.h5 --config configs/baseline/ci.yaml --z01 $z"
          $study $one --out $root
          $study $one --stages 1 --out $root/first-stage
          python - $t $root <<'EOF'
          import json, sys
          trace = next(r for r in map(json.loads, open(sys.argv[1])) if r["index"] == 0)
          mfe = {e["z01"]: e["mfe"] for e in trace["evaluations"] if e["reconstructed"]}
          full = json.load(open(f"{sys.argv[2]}/synthetic-0.json"))["points"]
          first = json.load(open(f"{sys.argv[2]}/first-stage/synthetic-0.json"))["points"]
          assert [p["mfe"] for p in full] == [mfe[p["z01"]] for p in full], full
          assert [p["mfe"] for p in first] == [p["stage_losses"][0] for p in full], first
          print(f"synthetic: {len(full)} points of the baseline and their first stage, bit for bit")
          EOF
          $study steps --out $root/steps
          $study compare --out $root/compare
          python scripts/make_stage9_figures.py --quick --out ${{ runner.temp }}/figures

      - name: Upload demo dataset
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-dataset-ci
          path: ${{ runner.temp }}/demo-dataset
          retention-days: 30
